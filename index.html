<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMANOLA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff}
.top{background:#3E224C;color:#F9B5C9;text-align:center;padding:8px;font-size:12px;font-weight:bold}
header{background:#3E224C;padding:12px;text-align:center;color:#F9B5C9;font-weight:900;letter-spacing:3px;font-size:22px}
.filtros{display:flex;gap:12px;padding:12px;overflow:auto}
.filtros div{min-width:70px;height:70px;border-radius:50%;background:#4D2B5E;display:grid;place-items:center;color:white;font-size:24px;flex-shrink:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ddd}
.card{background:white;padding-bottom:10px}
.card-img{background:#4D2B5E;height:220px;display:flex;align-items:center;justify-content:center;color:white;font-size:40px}
.card h3{font-size:12px;padding:8px 8px 0 8px;height:32px;overflow:hidden}
.card b{padding:0 8px;font-size:14px}
</style>
</head>
<body>
<div class="top">3 Y 6 CUOTAS SIN INTERÉS</div>
<header>imanola</header>
<div class="filtros">
<div style="background:#FF2D7A">⊞</div><div>👜</div><div>👢</div><div>👛</div><div>%</div>
</div>
<h2 style="text-align:center;padding:14px;letter-spacing:4px;color:#3E224C">COLECCIÓN</h2>
<div class="grid">
<div class="card"><div class="card-img">👜</div><h3>Porta celular BLONDIE</h3><b>$77.000</b></div>
<div class="card"><div class="card-img">👝</div><h3>Riñonera BRISELA</h3><b>$95.000</b></div>
<div class="card"><div class="card-img">👢</div><h3>Botineta ROSELLE</h3><b>$179.500</b></div>
<div class="card"><div class="card-img">👛</div><h3>Billetera Pocket ANNE</h3><b>$55.840</b></div>
<div class="card"><div class="card-img">🥾</div><h3>Botas TAYRA</h3><b>$272.000</b></div>
<div class="card"><div class="card-img">👜</div><h3>Cartera LUNA</h3><b>$89.000</b></div>
</div>
</body>
</html>
