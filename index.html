<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMANOLA - Carteras en Cuero Argentino</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Montserrat,sans-serif}
:root{--violeta:#3E224C;--rosa:#F9B5C9;--fondo:#4D2B5E}
body{background:#fff;color:#3E224C}
.top{background:var(--violeta);color:var(--rosa);text-align:center;padding:8px;font-size:12px;font-weight:600;letter-spacing:1px}
header{background:var(--violeta);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;position:sticky;top:0;z-index:10}
.logo{color:var(--rosa);font-weight:800;line-height:.9;text-align:center}
.logo b{font-size:22px;letter-spacing:2px}
.logo span{font-size:9px;letter-spacing:3px;display:block}
.icons{display:flex;gap:14px;color:var(--rosa);font-size:18px}
.cats{display:flex;gap:12px;padding:12px;overflow:auto}
.cats div{min-width:88px;height:88px;border-radius:50%;background:var(--fondo);display:grid;place-items:center;color:#fff;font-size:11px;text-align:center;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;background:#e9e9e9;gap:1px}
.card{background:#fff;cursor:pointer}
.card-img{background:var(--fondo);height:210px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:#fff;color:var(--violeta);font-size:10px;font-weight:800;padding:5px 10px;border-radius:20px}
.info{padding:10px 12px}
.info h3{font-size:12px;font-weight:600;line-height:1.2;min-height:30px}
.price{margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.old{text-decoration:line-through;color:#999;font-size:11px}
.new{font-weight:800;font-size:14px}
.colores{font-size:11px;color:#666;margin-top:4px}
/* MODAL */
#modal{position:fixed;inset:0;background:#fff;z-index:100;display:none;overflow:auto}
.modal-top{background:var(--violeta);color:var(--rosa);display:flex;justify-content:space-between;padding:12px 16px;position:sticky;top:0}
.carousel{position:relative;height:460px;background:var(--fondo);overflow:hidden}
.track{display:flex;height:100%;transition:transform .35s ease}
.track img{min-width:100%;height:100%;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.85);font-size:22px;cursor:pointer}
.prev{left:10px}.next{right:10px}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);display:block}
.dots i.on{background:var(--rosa);width:20px}
.count{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:4px 10px;border-radius:20px}
</style>
</head>
<body>
<div class="top">3 Y 6 CUOTAS SIN INTERÉS</div>
<header><span style="color:var(--rosa)">☰</span><div class="logo"><b>imanola</b><span>ELEGANCIA EN CUERO</span></div><div class="icons"><span>🔍</span><span>👤</span><span>🛒 2</span></div></header>
<div class="cats"><div>Carteras<br>Bandoleras</div><div>Calzado</div><div>Accesorios</div><div>Sale</div></div>

<div class="grid" id="grid"></div>

<div id="modal">
<div class="modal-top"><span id="mtitle"></span><span onclick="modal.style.display='none'" style="cursor:pointer">✕</span></div>
<div class="carousel" id="car"><div class="track" id="track"></div><button class="nav prev" onclick="go(-1)">‹</button><button class="nav next" onclick="go(1)">›</button><div class="dots" id="dots"></div><div class="count" id="count"></div></div>
<div style="padding:16px"><h2 id="dTitle"></h2><div id="dPrice" style="margin-top:10px"></div><p style="margin-top:12px;font-size:13px;color:#666">100% cuero argentino. Envíos a todo el país.</p><a id="wa" target="_blank" style="display:block;text-align:center;background:var(--violeta);color:var(--rosa);padding:16px;border-radius:10px;margin-top:18px;text-decoration:none;font-weight:800">CONSULTAR POR WHATSAPP</a></div>
</div>
