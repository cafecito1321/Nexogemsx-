<title>Imanola - Elegancia en Cuero</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{background:#F8F2F6;color:#3E224C}
.header{background:#3E224C;color:#F9B5C9;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:0;z-index:10}
.cats{display:flex;justify-content:space-around;padding:18px 8px;background:white;border-bottom:1px solid #f0d6e0}
.cat{width:72px;text-align:center;cursor:pointer}
.cat-circle{width:66px;height:66px;border-radius:50%;border:2.5px solid #F9B5C9;display:grid;place-items:center;background:#3E224C;color:#F9B5C9;font-size:26px;margin:0 auto}
.cat.active .cat-circle{background:#FF2E6D;border-color:#FF2E6D;color:white}
.cat p{font-size:9px;margin-top:6px;font-weight:600;line-height:1.2}
.title{text-align:center;padding:18px;font-weight:800;letter-spacing:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:0 12px 90px}
.card{background:#4A2B5A;border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;height:176px;object-fit:cover;background:#5B3370}
.card .inf{padding:10px;background:white;min-height:86px}
.card .inf h4{font-size:11.5px;font-weight:700;min-height:28px}
.card .price{font-weight:900;font-size:13px;margin-top:4px}
.badge{position:absolute;top:8px;left:8px;background:#FF2E6D;color:white;font-size:10px;font-weight:900;padding:4px 8px;border-radius:6px}
.badge.black{background:#444}
#modal{display:none;position:fixed;inset:0;background:#fff;z-index:99;overflow:auto}
.m-top{background:#3E224C;color:#F9B5C9;display:flex;justify-content:space-between;padding:12px 14px;position:sticky;top:0}
.m-img{height:380px;background:#5B2E75;display:grid;place-items:center}
.m-img img{width:100%;height:100%;object-fit:contain}
.m-body{padding:16px}
.btn{width:100%;background:#F9B5C9;color:#3E224C;border:none;padding:16px;border-radius:8px;font-weight:900;margin:12px 0}
.detail{font-size:13px;line-height:1.6;color:#444;margin-top:12px}
.chip{border:1px solid #ddd;padding:4px 8px;font-size:10px;border-radius:4px;margin-right:4px;background:#fff}
</style>
</head>
<body>
<div class="header"><div>☰ ⌕</div><div style="text-align:center"><b>imanola</b><div style="font-size:6px;letter-spacing:2px">ELEGANCIA EN CUERO</div></div><div>👤 🛒</div></div>

<div class="cats">
<div class="cat active" onclick="filtrar('todo',this)"><div class="cat-circle">⊞</div><p>Todo</p></div>
<div class="cat" onclick="filtrar('carteras',this)"><div class="cat-circle">👜</div><p>Carteras |<br>Bandolera</p></div>
<div class="cat" onclick="filtrar('calzado',this)"><div class="cat-circle">👢</div><p>Calzado</p></div>
<div class="cat" onclick="filtrar('accesorios',this)"><div class="cat-circle">👝</div><p>Accesorios</p></div>
<div class="cat" onclick="filtrar('sale',this)"><div class="cat-circle">%</div><p>Sale</p></div>
</div>

<div class="title" id="coleccion">COLECCIÓN</div>
<div class="grid" id="grid"></div>

<div id="modal">
<div class="m-top"><span id="mBread" style="font-size:11px"></span><button onclick="document.getElementById('modal').style.display='none'" style="background:none;border:none;color:#F9B5C9;font-size:22px">✕</button></div>
<div class="m-img"><img id="mImg"></div>
<div class="m-body">
<h2 id="mTitle"></h2>
<div id="mPrice" style="font-size:20px;font-weight:900;margin:6px 0"></div>
<div id="mCuota" style="font-size:12px;color:#777"></div>
<div style="margin:14px 0;font-size:12px">COLOR: <span id="mColor" style="font-weight:700"></span> • TALLE: <span id="mTalle"></span></div>
<div id="mChips"></div>
<button class="btn" id="mBtn">AGREGAR AL CARRITO</button>
<div class="detail" id="mDesc"></div>
</div>
</div>
